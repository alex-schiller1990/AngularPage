<div class="p-6 container">

  <div class="mb-8 flex flex-wrap items-center justify-between gap-4 animate-fade-in-up stagger-1">
    <h1 class="text-h2 font-semibold">Anime</h1>
    <div class="flex items-center gap-2">
      @if (authService.user()) {
        <a
          routerLink="/anime/new"
          class="btn btn-primary"
        >
          Add
        </a>
      }
      <button
        type="button"
        (click)="refreshList()"
        [disabled]="animeService.listLoading()"
        class="btn btn-secondary"
      >
        @if (animeService.listLoading()) {
          Refreshing…
        } @else {
          Refresh from Firebase
        }
      </button>
    </div>
  </div>

  <div class="mb-6 flex gap-2 border-b border-[var(--color-border)] animate-fade-in-up stagger-2">
    <button
      type="button"
      (click)="switchTab('list')"
      class="border-b-2 px-4 py-2 text-sm font-medium transition-colors"
      [class]="activeTab() === 'list' ? 'border-[var(--color-brand)] text-[var(--color-brand)]' : 'border-transparent text-[var(--color-text-muted)]'"
    >
      List
    </button>
    <button
      type="button"
      (click)="switchTab('year-review')"
      class="border-b-2 px-4 py-2 text-sm font-medium transition-colors"
      [class]="activeTab() === 'year-review' ? 'border-[var(--color-brand)] text-[var(--color-brand)]' : 'border-transparent text-[var(--color-text-muted)]'"
    >
      Year Review
    </button>
  </div>

  @if (activeTab() === 'year-review') {
    <app-anime-year-review class="animate-fade-in-up stagger-3" />
  } @else {
    <app-filter-bar
      [searchQuery]="searchQuery()"
      [chips]="activeFilterChips()"
      [resultCount]="filteredAnime().length"
      (searchQueryChange)="searchQuery.set($event)"
      (clearAll)="clearAllFilters()"
      (chipRemoved)="removeFilterChip($event)"
    >
      <app-filter-dropdown
        [label]="'Status'"
        [selectedCount]="selectedStatuses().size"
        [options]="statusFilterOptions()"
        [panelWidthClass]="'w-56'"
        (optionToggled)="toggleStatus($event)"
      />

      <app-filter-dropdown
        [label]="'Rating'"
        [selectedCount]="selectedRatings().size"
        [options]="ratingFilterOptions()"
        [panelWidthClass]="'w-40'"
        (optionToggled)="toggleRating($event)"
      />

      <app-filter-dropdown
        [label]="'Release year'"
        [selectedCount]="selectedReleaseYears().size"
        [options]="releaseYearFilterOptions()"
        [panelWidthClass]="'w-44'"
        (optionToggled)="toggleReleaseYear($event)"
      />

      <app-filter-dropdown
        [label]="'Watched year'"
        [selectedCount]="selectedWatchedYears().size"
        [options]="watchedYearFilterOptions()"
        [panelWidthClass]="'w-44'"
        (optionToggled)="toggleWatchedYear($event)"
      />

      <app-sort-select
        [options]="sortOptions"
        [value]="sortOption()"
        (valueChange)="sortOption.set($event)"
      />
    </app-filter-bar>

    @if (filteredAnime().length === 0) {
      <div class="card p-12 text-center animate-fade-in-up stagger-4">
        <div class="text-4xl mb-4" aria-hidden="true">🎌</div>
        <h2 class="text-h3 font-semibold text-[var(--color-text-primary)] mb-2">No anime match your search</h2>
        <p class="text-body text-[var(--color-text-muted)]">Try adjusting your filters or search term.</p>
      </div>
    } @else {
      <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        @for (anime of filteredAnime(); track anime.id; let index = $index) {
          <app-list-item-card
            [link]="['/anime', anime.title]"
            [coverURL]="anime.coverURL"
            [coverAspectClass]="'aspect-[290/410]'"
            [name]="anime.name"
            [subtitle]="anime.releaseYear"
            [status]="anime.status"
            [progress]="anime.progress"
            [startDate]="anime.startDate"
            [endDate]="anime.endDate"
            [rating]="anime.rating"
            [index]="index"
          />
        }
      </div>
    }
  }

</div>
