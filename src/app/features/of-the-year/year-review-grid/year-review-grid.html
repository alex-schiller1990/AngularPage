<div class="mb-6 flex items-center justify-between gap-4">
  <p class="text-sm text-gray-600">{{ description() }}</p>
  @if (authService.user()) {
    <a
      [routerLink]="newRoute()"
      class="rounded-md bg-indigo-600 px-3 py-2 text-sm font-medium text-white hover:bg-indigo-700"
    >
      New Year Review
    </a>
  }
</div>

<div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
  @for (year of years(); track year) {
    <div class="mx-auto w-full max-w-[290px]">
      <div class="relative overflow-hidden rounded-lg bg-white shadow">
        <button type="button" (click)="openYearReview(year)" class="block w-full text-left">
          @if (yearIndex()?.covers?.[year]) {
            <img [src]="yearIndex()!.covers![year]" [alt]="year" [class]="aspectRatio() + ' w-full object-cover'" />
          } @else {
            <div [class]="aspectRatio() + ' w-full ' + placeholderColor()"></div>
          }
          <span class="absolute inset-x-0 bottom-0 bg-black/60 px-4 py-3 text-center text-xl font-semibold text-white">
            {{ year }}
          </span>
        </button>
        @if (authService.user() && editingYear() !== year) {
          <button type="button" (click)="startCoverEdit(year)" class="absolute right-2 top-2 rounded bg-white/90 px-2 py-1 text-sm" aria-label="Edit cover">
            ✎
          </button>
        }
      </div>
      @if (authService.user() && editingYear() === year) {
        <div class="mt-1 flex gap-2 rounded-lg border border-gray-200 bg-white p-2 shadow" (click)="$event.stopPropagation()">
          <input
            type="url"
            [value]="coverUrl()"
            (input)="coverUrl.set($any($event.target).value)"
            placeholder="Cover URL"
            class="min-w-0 flex-1 rounded border border-gray-300 px-2 py-1 text-xs"
          />
          <button type="button" (click)="saveCover(year)" class="text-xs text-indigo-600">Save</button>
          <button type="button" (click)="cancelCoverEdit()" class="text-xs text-gray-500">Cancel</button>
        </div>
      }
    </div>
  } @empty {
    <p class="text-sm text-gray-600">No year reviews available.</p>
  }
</div>
