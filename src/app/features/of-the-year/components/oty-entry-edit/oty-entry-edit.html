<div class="border border-gray-200 rounded-lg p-4 bg-gray-50 space-y-3">
  <div class="flex items-center gap-2 justify-between">
    <span class="font-medium text-gray-700">{{ label() }} {{ index() + 1 }}</span>
    <div class="flex gap-1">
      <button mat-stroked-button (click)="move.emit(-1)" [disabled]="index() === 0">↑</button>
      <button mat-stroked-button (click)="move.emit(1)" [disabled]="index() === total() - 1">↓</button>
      <button mat-stroked-button color="warn" (click)="remove.emit()">Remove</button>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Name</label>
      <input
        class="w-full border border-gray-300 rounded px-2 py-1 text-sm"
        [value]="entry().name"
        (input)="fieldChange.emit({ field: 'name', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">URL</label>
      <input
        class="w-full border border-gray-300 rounded px-2 py-1 text-sm"
        [value]="entry().url ?? ''"
        (input)="fieldChange.emit({ field: 'url', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Cover URL</label>
      <input
        class="w-full border border-gray-300 rounded px-2 py-1 text-sm"
        [value]="entry().cover ?? ''"
        (input)="fieldChange.emit({ field: 'cover', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">Placement</label>
      <input
        class="w-full border border-gray-300 rounded px-2 py-1 text-sm"
        [value]="entry().placement ?? ''"
        (input)="fieldChange.emit({ field: 'placement', value: $any($event.target).value })"
      />
    </div>
  </div>
  <div>
    <label class="block text-xs font-medium text-gray-600 mb-1">Description</label>
    <app-rich-editor
      [value]="initialDesc()"
      (valueChange)="fieldChange.emit({ field: 'description', value: $event })"
    />
  </div>
</div>
