<div class="border border-[var(--color-border)] rounded-lg p-4 bg-[var(--color-surface-card)] space-y-3">
  <div class="flex items-center gap-2 justify-between">
    <span class="font-medium text-[var(--color-text-primary)]">{{ label() }} {{ index() + 1 }}</span>
    <div class="flex gap-1">
      <button type="button" class="btn btn-secondary px-2" (click)="move.emit(-1)" [disabled]="index() === 0">↑</button>
      <button type="button" class="btn btn-secondary px-2" (click)="move.emit(1)" [disabled]="index() === total() - 1">↓</button>
      <button type="button" class="btn btn-ghost text-[var(--color-error)]" (click)="remove.emit()">Remove</button>
    </div>
  </div>
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label class="block text-caption mb-1">Name</label>
      <input
        class="input"
        [value]="entry().name"
        (input)="fieldChange.emit({ field: 'name', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-caption mb-1">URL</label>
      <input
        class="input"
        [value]="entry().url ?? ''"
        (input)="fieldChange.emit({ field: 'url', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-caption mb-1">Cover URL</label>
      <input
        class="input"
        [value]="entry().cover ?? ''"
        (input)="fieldChange.emit({ field: 'cover', value: $any($event.target).value })"
      />
    </div>
    <div>
      <label class="block text-caption mb-1">Placement</label>
      <input
        class="input"
        [value]="entry().placement ?? ''"
        (input)="fieldChange.emit({ field: 'placement', value: $any($event.target).value })"
      />
    </div>
  </div>
  <div>
    <label class="block text-caption mb-1">Description</label>
    <app-rich-editor
      [value]="initialDesc()"
      (valueChange)="fieldChange.emit({ field: 'description', value: $event })"
    />
  </div>
</div>
