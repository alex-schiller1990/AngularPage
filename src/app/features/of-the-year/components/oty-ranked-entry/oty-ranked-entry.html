<div class="flex flex-col sm:flex-row gap-4 p-4 rounded-lg bg-gray-50 border border-gray-200">
  @if (item().entry.cover) {
    <div class="w-full sm:w-36 shrink-0">
      <img
        [src]="item().entry.cover"
        [alt]="item().entry.name"
        class="w-full aspect-[290/410] rounded object-cover shadow-sm"
        loading="lazy"
      />
    </div>
  }
  <div class="flex-1 min-w-0">
    <div class="flex items-center gap-3 mb-2">
      <span
        class="inline-flex items-center justify-center h-8 w-8 rounded-full font-bold text-sm shrink-0"
        [class]="badgeClass"
      >
        {{ item().slot }}
      </span>
      <h3 class="text-xl font-bold text-gray-900 truncate">
        @if (item().entry.url) {
          <a [href]="item().entry.url" target="_blank" rel="noopener noreferrer" class="text-blue-600 hover:underline">
            {{ item().entry.name }}
          </a>
        } @else {
          {{ item().entry.name }}
        }
      </h3>
    </div>
    @if (item().entry.description) {
      <div class="rich-text text-gray-800 mt-2" [innerHTML]="item().entry.description"></div>
    }
  </div>
</div>
