<div class="rich-editor-wrapper">
  <div class="toolbar">
    <button
      type="button"
      class="tb-btn"
      [class.active]="isBold()"
      (click)="toggleBold()"
      matTooltip="Bold"
    ><b>B</b></button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isItalic()"
      (click)="toggleItalic()"
      matTooltip="Italic"
    ><em>I</em></button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isBulletList()"
      (click)="toggleBulletList()"
      matTooltip="Bullet list"
    >≡</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isOrderedList()"
      (click)="toggleOrderedList()"
      matTooltip="Ordered list"
    >1≡</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isBlockquote()"
      (click)="toggleBlockquote()"
      matTooltip="Blockquote"
    >"</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isLink()"
      (click)="setLink()"
      matTooltip="Insert / edit link"
    >🔗</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isSpoiler()"
      (click)="insertSpoiler()"
      matTooltip="Insert spoiler / accordion block"
    >▼…</button>

    @if (isSpoiler()) {
      <button
        type="button"
        class="tb-btn tb-btn-danger"
        (click)="deleteSpoiler()"
        matTooltip="Delete spoiler block"
      >✕</button>
    }

    <button
      type="button"
      class="tb-btn"
      [class.active]="showEmojiPicker()"
      (click)="toggleEmojiPicker()"
      matTooltip="Emoji picker"
    >😀</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="showSource()"
      (click)="toggleSource()"
      matTooltip="Toggle HTML source"
    >&lt;/&gt;</button>
  </div>

  @if (showEmojiPicker()) {
    <div class="emoji-picker">
      <div class="emoji-categories">
        @for (cat of emojiCategories; track cat.name) {
          <button
            type="button"
            class="emoji-cat-btn"
            [class.active]="activeCategory === cat.name"
            (click)="selectCategory(cat.name)"
          >{{ cat.name }}</button>
        }
      </div>
      <div class="emoji-grid">
        @for (emoji of activeCategoryEmojis(); track emoji) {
          <button
            type="button"
            class="emoji-btn"
            (click)="pickEmoji(emoji)"
          >{{ emoji }}</button>
        }
      </div>
    </div>
  }

  <textarea
    class="source-textarea"
    [hidden]="!showSource()"
    [(ngModel)]="sourceHtml"
    rows="8"
  ></textarea>
  <div #editorEl class="editor-content" [hidden]="showSource()"></div>
</div>
