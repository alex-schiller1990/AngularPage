<div class="rich-editor-wrapper">
  @if (label) {
    <span class="block text-sm text-gray-600 mb-1">{{ label }}</span>
  }

  <div class="toolbar">
    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('bold')"
      (click)="toggleBold()"
      matTooltip="Bold"
    ><b>B</b></button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('italic')"
      (click)="toggleItalic()"
      matTooltip="Italic"
    ><em>I</em></button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('bulletList')"
      (click)="toggleBulletList()"
      matTooltip="Bullet list"
    >≡</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('orderedList')"
      (click)="toggleOrderedList()"
      matTooltip="Ordered list"
    >1≡</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('blockquote')"
      (click)="toggleBlockquote()"
      matTooltip="Blockquote"
    >"</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="isActive('link')"
      (click)="setLink()"
      matTooltip="Insert / edit link"
    >🔗</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="showEmojiPicker()"
      (click)="toggleEmojiPicker()"
      matTooltip="Emoji picker"
    >😀</button>

    <button
      type="button"
      class="tb-btn"
      [class.active]="showSource()"
      (click)="toggleSource()"
      matTooltip="Toggle HTML source"
    >&lt;/&gt;</button>
  </div>

  @if (showEmojiPicker()) {
    <div class="emoji-picker">
      <div class="emoji-categories">
        @for (cat of emojiCategories; track cat.name) {
          <button
            type="button"
            class="emoji-cat-btn"
            [class.active]="activeCategory === cat.name"
            (click)="selectCategory(cat.name)"
          >{{ cat.name }}</button>
        }
      </div>
      <div class="emoji-grid">
        @for (emoji of activeCategoryEmojis(); track emoji) {
          <button
            type="button"
            class="emoji-btn"
            (click)="pickEmoji(emoji)"
          >{{ emoji }}</button>
        }
      </div>
    </div>
  }

  <textarea
    class="source-textarea"
    [hidden]="!showSource()"
    [(ngModel)]="sourceHtml"
    rows="8"
  ></textarea>
  <div #editorEl class="editor-content" [hidden]="showSource()"></div>
</div>
