<div class="space-y-2">
  <div class="flex items-center justify-between gap-2">
    <span class="text-caption">Additional dates</span>
    <button
      type="button"
      (click)="addDate.emit()"
      aria-label="Add additional date"
      class="btn btn-secondary text-sm"
    >
      Add
    </button>
  </div>

  @for (ad of additionalDates(); track $index; let i = $index) {
    <div class="space-y-2 rounded-md border border-[var(--color-border)] p-2 bg-[var(--color-surface-card)]">
      <input
        type="text"
        class="input"
        [placeholder]="commentPlaceholder()"
        [value]="ad.dateComment"
        (input)="onFieldInput(i, 'dateComment', $any($event.target).value)"
      />
      <div class="grid grid-cols-2 gap-2">
        <div class="space-y-1">
          <input
            type="text"
            class="input"
            placeholder="Start date"
            [value]="ad.startDate"
            (input)="onFieldInput(i, 'startDate', $any($event.target).value)"
          />
          <button
            type="button"
            class="btn btn-ghost text-xs w-full"
            (click)="onFieldInput(i, 'startDate', todayString())"
          >Today</button>
        </div>
        <div class="space-y-1">
          <input
            type="text"
            class="input"
            placeholder="End date"
            [value]="ad.endDate ?? ''"
            (input)="onFieldInput(i, 'endDate', $any($event.target).value)"
          />
          <button
            type="button"
            class="btn btn-ghost text-xs w-full"
            (click)="onFieldInput(i, 'endDate', todayString())"
          >Today</button>
        </div>
      </div>
      <button
        type="button"
        class="btn btn-ghost text-xs text-[var(--color-error)]"
        (click)="removeDate.emit(i)"
        aria-label="Remove additional date"
      >
        Remove
      </button>
    </div>
  }
</div>
