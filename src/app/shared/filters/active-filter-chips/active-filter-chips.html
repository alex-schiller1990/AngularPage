@if (chips().length > 0) {
  <div class="flex flex-wrap items-center gap-2 pt-1">
    @for (chip of chips(); track chip.type + '-' + chip.value) {
      <button
        type="button"
        (click)="onRemoveChip(chip)"
        class="rounded-full border border-violet-200 bg-violet-100 px-3 py-1 text-xs text-violet-700 hover:bg-violet-200 dark:border-violet-800 dark:bg-violet-900/30 dark:text-violet-300 dark:hover:bg-violet-900/50"
        [attr.aria-label]="'Remove filter ' + chip.label"
      >
        {{ chip.label }} x
      </button>
    }
  </div>
}
